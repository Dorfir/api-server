<!DOCTYPE html>
<html>

<head>
  <title>Backoffice</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="backoffice.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />

  <link rel="shortcut icon" href="../favicon.png" type="image/png">
</head>

<body>

  <div id="big-container">

    <div id="menu-container">
      <img src="./img/green_city_logo_blue.svg" alt="GreenCity" class="logo">
      <div class="menu-item">Lister</div>
      <div class="menu-item active">Créer</div>
      <div class="menu-item">Modifier</div>
    </div>

    <div id="content-container">

      <div id="main-container">

        <div id="form-container">

          <div class="ligne" id="create_famille">
          </div>

          <div class="ligne" id="create_categorie">
          </div>
          
          <hr />

          <div class="ligne" id="create_nom">
            <div class="form_label">Nom</div>
            <input type="text" id="input_nom" placeholder="Nom du produit" autocomplete="new-password">
          </div>

          <div class="ligne" id="create_marque">
            <div class="form_label">Marque</div>
            <input type="text" id="input_marque" placeholder="Marque du produit" autocomplete="new-password">
          </div>

          <hr />

          <div class="ligne" id="create_titre_group">
            <div class="form_label">Titre</div>
            <input type="text" id="input_titre_groupe" placeholder="Titre section" autocomplete="new-password">
          </div>

          <div id="description-big-container">
            <div class="form_label">Descriptions</div>
            <div class="quill-container">
              <div class="editor-container">
                <div class="description-editor" id="description-0"></div>
              </div>
            </div>
            <input type="button" value="+ Ajouter un paragraphe de description" id="add_desciption_item">
          </div>

          <div class="ligne">
            <div class="form_label">Vignette</div>
            <input type="button" value="Ajouter une image vignette" id="add_thumb">
          </div>

          <!-- <img id="image" src="" alt="dragon"> -->

        </div>

        <div id="render">

          <div id="produit-header">
            <div id="produit-header-titre">
              <div id="produit-header-titre-text">PAROIS DE DOUCHE</div>
              <svg viewBox="0 0 150 5" id="produit-header-titre-separator">
                <line x1="0" y1="3" x2="150" y2="3" class="line-svg" />
              </svg>
            </div>
            <svg id="produit-header-close-btn" viewBox="0 0 50 50">
              <rect x="0" y="0" width="50" height="50" fill="#ffffff" opacity="0.001"></rect>
              <path fill="#1a2a48" d="M0,0v50h50V0h0ZM47.58,47.58H2.41V2.41h45.17v45.17Z" />
              <polygon fill="#1a2a48"
                points="14.92 16.75 16.49 15.18 25.1 23.56 33.25 15.18 34.92 16.74 26.83 25.03 35.11 33.2 33.53 34.78 24.92 26.4 16.76 34.78 15.09 33.22 23.19 24.92 14.92 16.75" />
            </svg>
          </div>

          <div class="fiche-produit-container">
            <div class="fiche-produit">
              <div class="modal-main">

                <div class="modal-main-separator">&nbsp;</div>

                <div class="produit-marque-container">
                  <div class="produit-nom" id="produit-nom"></div>
                  <div class="produit-marque" id="produit-marque"></div>
                  <svg viewBox="0 0 100 5" class="produit-separator">
                    <line x1="0" y1="3" x2="100" y2="3" class="line-svg-thin" />
                  </svg>
                </div>

                <div class="produit-titre-groupe" id="produit-titre-groupe"></div>

                <div class="produit-group">
                  <div class="produit-descriptif" id='produit-descriptif'></div>
                  <img src="../img/produits/paroisDouche_concertoWalkAlterna.jpg" class="produit-picture" id="produit-picture">
                </div>

              </div>
            </div>

          </div>



        </div>

      </div>

    </div>

    

  </div>

  

  <div id="popup-container">
    <div id="popup-add-famille">
      <button id="popup-add-famille-close">X</button>
      <h3>Ajouter une famille de produit</h3>
      <input id="add-famille-input" type="text" placeholder="Nom de la famille de produit"
        autocomplete="new-password" />
      <button id="add-famille-button">Créer une famille de produit</button>
    </div>
    <div id="popup-add-categorie">
      <button id="popup-add-categorie-close">X</button>
      <h3>Ajouter une catégorie de produit</h3>
      <input id="add-categorie-input" type="text" placeholder="Nom de la catégorie de produit"
        autocomplete="new-password" />
      <button id="add-categorie-button">Créer une catégorie de produit</button>
    </div>

    <div id="popup-add-image">

    </div>
  </div>

  <div id="popup-canvas-container">
  
    <div id="popup-canvas">
  
      <div id="canvas_big_container">
        <div id="canvas-zoom-container">
          Zoom de l'image : <input type="range" name="zoom" id="zoom" min="-1" max="1" step="0.1" value="0">
        </div>
        <canvas id="canvas"></canvas>
        <div id="drag-drop-area">
          <div class="drop-container">
            <span class="drop-title">Déposer votre fichier image</span>
            ou
            <input type="file" id="filesearch_button" accept="image/*" required>
          </div>
        </div>
  
        <div id="download_btn_container">
          <div id="reload-button">
            <img src="./img/reload.svg" alt=""> <span>Charger une autre image</span>
          </div>
          <button class="download">Valider cette sélection</button>
        </div>
  
      </div>
  
    </div>
  </div>

  <canvas id="canvas2"></canvas>

  <div id="loader-container">
    <div class="lds-ring">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>



  <!-- Include the Quill library -->
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

  <!-- Initialize Quill editor -->
   <script src="creeper_clear.js"></script>
  <script src="backoffice.js"></script>


</body>

</html>
