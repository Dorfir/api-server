<!DOCTYPE html>
<html>

<head>
  <title>Backoffice</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="backoffice.css">
  <!-- <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" /> -->
  <link href="quill.snow.css" rel="stylesheet" />

  <link rel="shortcut icon" href="../favicon.png" type="image/png">
</head>

<body>

  <div id="big-container">

    <div id="menu-container">
      <img src="./img/green_city_logo_blue.svg" alt="GreenCity" class="logo">
      <div class="menu-item active" id="btn-menu-lister-produits">Lister</div>
      <div class="menu-item" id="btn-menu-nouveau-produit">Créer</div>
      
      <div class="menu-item" id="btn-menu-reset-produit">Reset</div>
      <!-- <div class="menu-item">Modifier</div> -->
    </div>

    <div id="content-container">

      <div id="list-produit-container" class="xCustomScroll">


      </div>

      <!-- Page de création d'un nouveau produit - suffixe 'ep_' -->
      <div id="edit-produit-container">

        <div class="xCustomScroll" id="ep_form_container">

          <div class="ligne" id="ep_ligne_famille"></div>

          <div class="ligne" id="ep_ligne_categorie"></div>
          
          <hr />
          <div class="ligne_row">
            <div class="ligne" id="ep_ligne_thumb">
            
            </div>
            <div id="ep_thumb_overview_container"></div>
          </div>
          
          <hr />
          <div class="ligne" id="ep_ligne_nom"></div>

          <div class="ligne" id="ep_ligne_marque"></div>

          <hr />
          <div class="ligne" id="ep_ligne_prix"></div>

          <div id="ep_description_group_container"></div>

          <div id="ep_add_description_group_container"></div>

          <div id="ep_send_server_container"></div>
    
        </div>

        <div id="ep_render">

          <div id="ep_produit_header">
            <div id="ep_produit-header-titre">
              <div id="ep_produit-header-titre-text">PAROIS DE DOUCHE</div>
              <svg viewBox="0 0 150 5" class="produit-header-titre-separator">
                <line x1="0" y1="3" x2="150" y2="3" class="line-svg" />
              </svg>
            </div>
          </div>

          <div class="fiche-produit-container">
            <div class="fiche-produit">
              <div class="modal-main xCustomScroll" id="ep_render_parent"></div>
            </div>
          </div>

        </div>

      </div>

      <!-- Page de création d'un nouveau produit - suffixe 'np_' -->
      <div id="new-produit-container">

        <div class="xCustomScroll" id="np_form_container">

          <div class="ligne" id="np_ligne_famille"></div>

          <div class="ligne" id="np_ligne_categorie"></div>
          
          <hr />
          <div class="ligne_row">
            <div class="ligne" id="np_ligne_thumb">
            
            </div>
            <div id="np_thumb_overview_container"></div>
          </div>
          
          <hr />
          <div class="ligne" id="np_ligne_nom"></div>

          <div class="ligne" id="np_ligne_marque"></div>

          <hr />
          <div class="ligne" id="np_ligne_prix"></div>

          <div id="np_description_group_container"></div>

          <div id="np_add_description_group_container"></div>

          <div id="np_send_server_container"></div>
    
        </div>

        <div id="np_render">

          <div id="np_produit_header">
            <div id="np_produit-header-titre">
              <div id="np_produit-header-titre-text">PAROIS DE DOUCHE</div>
              <svg viewBox="0 0 150 5" class="produit-header-titre-separator">
                <line x1="0" y1="3" x2="150" y2="3" class="line-svg" />
              </svg>
            </div>
            <svg id="produit-header-close-btn" viewBox="0 0 50 50">
              <rect x="0" y="0" width="50" height="50" fill="#ffffff" opacity="0.001"></rect>
              <path fill="#1a2a48" d="M0,0v50h50V0h0ZM47.58,47.58H2.41V2.41h45.17v45.17Z" />
              <polygon fill="#1a2a48"
                points="14.92 16.75 16.49 15.18 25.1 23.56 33.25 15.18 34.92 16.74 26.83 25.03 35.11 33.2 33.53 34.78 24.92 26.4 16.76 34.78 15.09 33.22 23.19 24.92 14.92 16.75" />
            </svg>
          </div>

          <div class="fiche-produit-container">
            <div class="fiche-produit">
              <div class="modal-main xCustomScroll" id="np_render_parent"></div>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>

  <div id="popup-container">
    <div id="popup-add-famille">
      <button id="popup-add-famille-close">X</button>
      <h3>Ajouter une famille de produit</h3>
      <input id="add-famille-input" type="text" placeholder="Nom de la famille de produit"
        autocomplete="new-password" />
      <button id="add-famille-button">Créer une famille de produit</button>
    </div>
    <div id="popup-add-categorie">
      <button id="popup-add-categorie-close">X</button>
      <h3>Ajouter une catégorie de produit</h3>
      <input id="add-categorie-input" type="text" placeholder="Nom de la catégorie de produit"
        autocomplete="new-password" />
      <button id="add-categorie-button">Créer une catégorie de produit</button>
    </div>

    <div id="popup-add-image">

    </div>
  </div>

  <!-- Cropper Image -->
  <div id="popup-canvas-container">
  
    <div id="popup-canvas">
  
      <div id="canvas_big_container">
        <div id="canvas-zoom-container">
          Zoom de l'image : <input type="range" name="zoom" id="zoom" min="-1" max="1" step="0.1" value="0">
        </div>
        <canvas id="canvas"></canvas>
        <div id="drag-drop-area">
          <div class="drop-container">
            <span class="drop-title">Déposer votre fichier image</span>
            ou
            <input type="file" id="filesearch_button" accept="image/*" required>
          </div>
        </div>
  
        <div id="download_btn_container">
          <div id="reload-button">
            <img src="./img/reload.svg" alt=""> <span>Charger une autre image</span>
          </div>
          <button class="download">Valider cette sélection</button>
        </div>
  
      </div>
  
    </div>

    <button id="close-popup-canvas-container">Fermer</button>

  </div>
  <canvas id="canvas2"></canvas>

  <!-- Loader -->
  <div id="loader-container">
    <div class="lds-ring">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>



  <!-- Include the Quill library -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script> -->
  <script src="quill.js"></script>

  <!-- Initialize Quill editor -->
   <script src="creeper_clear.js"></script>
  <script src="backoffice.js"></script>


</body>

</html>
